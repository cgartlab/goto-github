# GoToGitHub CI — shellcheck + tests on push/PR
name: Lint

on:
  push:
    branches: [main, dev-*]
    paths:
      - 'fetch.sh'
      - 'install.sh'
      - 'lib/**'
      - 'shared/**'
      - '*.ps1'
      - 'ps1/**'
      - 'tests/**'
  pull_request:
    branches: [main]
    paths:
      - 'fetch.sh'
      - 'install.sh'
      - 'lib/**'
      - 'shared/**'
      - '*.ps1'
      - 'ps1/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run ShellCheck (whole repo)
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning

      - name: Run unit tests
        run: |
          for f in tests/test-*.sh; do
            echo "== $f =="
            bash "$f"
          done

      - name: Check bash/PowerShell constant parity
        run: bash shared/parity-check.sh

  pwsh-lint:
    name: PowerShell lint (PSScriptAnalyzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run PSScriptAnalyzer on *.ps1
        shell: pwsh
        run: |
          # runner 预装 PSScriptAnalyzer；缺失才安装
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          }
          # 逐文件分析：-Path 对数组绑定的行为随版本不稳，单文件传最稳
          $all = @()
          foreach ($f in (Get-ChildItem -Recurse -Filter *.ps1)) {
            $v = Invoke-ScriptAnalyzer -Path $f.FullName `
              -Severity @('Error', 'Warning') `
              -ExcludeRule @('PSAvoidUsingWriteHost', 'PSAvoidUsingPlainTextForPassword', 'PSUseDeclaredVarsMoreThanAssignments', 'PSReviewUnusedParameter', 'PSUseShouldProcessForStateChangingFunctions', 'PSUseApprovedVerbs', 'PSUseSingularNouns', 'PSUseBOMForUnicodeEncodedFile') 2>$null
            if ($v) { $all += $v }
          }
          # 门槛：Error 级才阻断；Warning（命名/BOM 等风格）仅展示，避免强制重写既有脚本
          if ($all) {
            $all | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize
            $errs = @($all | Where-Object { $_.Severity -eq 'Error' })
            if ($errs.Count -gt 0) { exit 1 }
          }
          Write-Host "PSScriptAnalyzer passed (no errors; style warnings informational)"

  pwsh-test:
    # Scan-based PowerShell implementation under ps1/. Runs on windows-latest
    # because it targets C:\...\etc\hosts, WindowsIdentity (UAC) and the HKLM DNS
    # registry, and its curl mock is a .cmd file. Lint above stays on ubuntu
    # because PSScriptAnalyzer is platform-independent.
    name: PowerShell tests (ps1/)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run ps1/ unit tests
        shell: pwsh
        run: |
          $fail = 0
          foreach ($f in (Get-ChildItem -Path tests -Filter 'test-ps-*.ps1' | Sort-Object Name)) {
            Write-Host "== $($f.Name) =="
            # try/catch: a terminating error inside a test must not abort the
            # step before the remaining files run (it would hide other failures).
            try {
              & $f.FullName
              if ($LASTEXITCODE -ne 0) { $fail = 1 }
            } catch {
              Write-Host "  EXCEPTION: $_"
              $fail = 1
            }
          }
          exit $fail
