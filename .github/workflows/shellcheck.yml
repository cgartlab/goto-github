# GoToGitHub CI — shellcheck on push/PR
name: Lint

on:
  push:
    branches: [main, dev-*]
    paths:
      - 'fetch.sh'
      - 'install.sh'
      - '*.ps1'
      - 'tests/**'
  pull_request:
    branches: [main]
    paths:
      - 'fetch.sh'
      - 'install.sh'
      - '*.ps1'
      - 'tests/**'

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck on fetch.sh
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          additional_files: fetch.sh

      - name: Run ShellCheck on install.sh
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          name: install_sh
          additional_files: install.sh

      - name: Run unit tests
        run: bash tests/test_functions.sh

  pwsh-lint:
    name: PowerShell lint (PSScriptAnalyzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer on *.ps1
        shell: pwsh
        run: |
          # runner 预装 PSScriptAnalyzer；缺失才安装
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          }
          # 逐文件分析：-Path 对数组绑定的行为随版本不稳，单文件传最稳
          $violations = @()
          foreach ($f in (Get-ChildItem -Recurse -Filter *.ps1)) {
            $v = Invoke-ScriptAnalyzer -Path $f.FullName `
              -Severity @('Error', 'Warning') `
              -ExcludeRule @('PSAvoidUsingWriteHost', 'PSAvoidUsingPlainTextForPassword', 'PSUseDeclaredVarsMoreThanAssignments', 'PSReviewUnusedParameter', 'PSUseShouldProcessForStateChangingFunctions') 2>$null
            if ($v) { $violations += $v }
          }
          if ($violations.Count -gt 0) {
            $violations | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize
            exit 1
          }
          Write-Host "PSScriptAnalyzer passed"